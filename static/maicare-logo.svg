<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" role="img" aria-labelledby="title desc">
  <title id="title">MaiCare Solutions</title>
  <desc id="desc">A radial blue dot mark beside the words MaiCare Solutions</desc>
  <defs>
    <linearGradient id="brand" x1="19" y1="109" x2="109" y2="19" gradientUnits="userSpaceOnUse">
      <stop stop-color="#253b80"/>
      <stop offset="1" stop-color="#27aae1"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&amp;display=swap');
      .logo-text-brand {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        fill: #253b80;
        letter-spacing: -0.02em;
      }
      .logo-text-secondary {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        fill: #248fc6;
        letter-spacing: 0.52em;
      }
    </style>
  </defs>
  <g transform="translate(10 22.5) scale(.82)" fill="url(#brand)">
    <!-- 4 Center circles (Large) -->
    <circle cx="55" cy="55" r="6.8"/>
    <circle cx="55" cy="73" r="6.8"/>
    <circle cx="73" cy="55" r="6.8"/>
    <circle cx="73" cy="73" r="6.8"/>

    <!-- 12 Surrounding circles (Medium) -->
    <!-- 4 Corners of the 4x4 grid -->
    <circle cx="37" cy="37" r="4.8"/>
    <circle cx="37" cy="91" r="4.8"/>
    <circle cx="91" cy="37" r="4.8"/>
    <circle cx="91" cy="91" r="4.8"/>
    <!-- 8 Edge dots of the 4x4 grid -->
    <circle cx="55" cy="37" r="4.8"/>
    <circle cx="73" cy="37" r="4.8"/>
    <circle cx="55" cy="91" r="4.8"/>
    <circle cx="73" cy="91" r="4.8"/>
    <circle cx="37" cy="55" r="4.8"/>
    <circle cx="37" cy="73" r="4.8"/>
    <circle cx="91" cy="55" r="4.8"/>
    <circle cx="91" cy="73" r="4.8"/>

    <!-- 8 Extra outer circles (Small) -->
    <!-- Top & Bottom -->
    <circle cx="55" cy="19" r="3.2"/>
    <circle cx="73" cy="19" r="3.2"/>
    <circle cx="55" cy="109" r="3.2"/>
    <circle cx="73" cy="109" r="3.2"/>
    <!-- Left & Right -->
    <circle cx="19" cy="55" r="3.2"/>
    <circle cx="19" cy="73" r="3.2"/>
    <circle cx="109" cy="55" r="3.2"/>
    <circle cx="109" cy="73" r="3.2"/>
  </g>
  <path d="M125 36v78" stroke="#248fc6" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="73" class="logo-text-brand" font-size="44">MAICARE</text>
  <text x="151.5" y="107" class="logo-text-secondary" font-size="21">SOLUTIONS</text>
</svg>
